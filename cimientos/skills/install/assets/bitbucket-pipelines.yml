# Bitbucket Pipelines for a project that uses easyone-orchestrator.
# Every push runs the checks. Story branches and the integration branch also move the story's Jira card:
# jira-sync runs in after-script, so a red build still moves the card (to Integration, for example).
# The tests run first, through stories.mjs, so their results exist even when a later check fails. A build
# that fails before them (installing the dependencies) has no results, and then the card stays where it is.
# The project keeps no copy of the story scripts: each step downloads them from the plugin's repository.
# To pin a version, replace main in ORQ with a commit of that repository.
# Secured repository variables: JIRA_EMAIL, JIRA_API_TOKEN.

image: {{IMAGE: an image with Go, Node 22 and pnpm}}

clone:
  depth: full # jira-sync compares the story branches with git merge-base

definitions:
  services:
    postgres:
      image: postgres:18
      variables:
        POSTGRES_PASSWORD: {{TEST_DB_PASSWORD: a throwaway password for the test database}}
  steps:
    - step: &build
        name: Verify, stories and Jira
        services:
          - postgres
        caches:
          - node
        script:
          - export ORQ=https://raw.githubusercontent.com/SergioHyliacom/Orquestador/main/scripts
          - mkdir -p /tmp/orq && curl -fsSL "$ORQ/stories.mjs" -o /tmp/orq/stories.mjs && curl -fsSL "$ORQ/jira-sync.mjs" -o /tmp/orq/jira-sync.mjs
          - {{SETUP: install the dependencies, e.g. pnpm install --frozen-lockfile && go mod download}}
          - node /tmp/orq/stories.mjs --tests --check
          - {{VERIFY: one line per command in .orchestrator.json → verify.all that stories.config.json → tests does not already run}}
        after-script:
          - node /tmp/orq/jira-sync.mjs
    - step: &stories
        name: Stories and Jira
        script:
          - export ORQ=https://raw.githubusercontent.com/SergioHyliacom/Orquestador/main/scripts
          - mkdir -p /tmp/orq && curl -fsSL "$ORQ/stories.mjs" -o /tmp/orq/stories.mjs && curl -fsSL "$ORQ/jira-sync.mjs" -o /tmp/orq/jira-sync.mjs
          - node /tmp/orq/stories.mjs --check
        after-script:
          - node /tmp/orq/jira-sync.mjs

pipelines:
  default: # fix/*, chore/*, hotfix/*: verified like the rest; jira-sync has no card to move
    - step: *build
  branches:
    "design/*":
      - step: *stories
    "story/*":
      - step: *build
    {{INTEGRATION_BRANCH: e.g. develop}}:
      - step: *build
    main:
      - step: *build
